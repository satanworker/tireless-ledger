services:
  pi-memoryd:
    build:
      context: .
      dockerfile: Dockerfile
    image: pi-memoryd:local
    restart: unless-stopped
    env_file: .env
    ports:
      - "100.127.82.49:8090:8090"
    environment:
      PI_MEMORYD_LISTEN: ":8090"
      PI_MEMORYD_STORAGE_URL: "s3://${PI_MEMORYD_S3_BUCKET:?set PI_MEMORYD_S3_BUCKET}/${PI_MEMORYD_S3_PREFIX:-session-recall-lance-token-chunks-v4}"
      PI_MEMORYD_RAW_URL: "s3://${PI_MEMORYD_S3_BUCKET:?set PI_MEMORYD_S3_BUCKET}/${PI_MEMORYD_RAW_PREFIX:-session-recall-raw-v1}"
      PI_MEMORYD_EMBED_URL: "http://llama-embed:8091"
      PI_MEMORYD_RAW_POLL_INTERVAL: "${PI_MEMORYD_RAW_POLL_INTERVAL:-30s}"
      PI_MEMORYD_RAW_WRITE_INTERVAL: "${PI_MEMORYD_RAW_WRITE_INTERVAL:-5m}"
      PI_MEMORYD_VECTOR_NPROBES: "${PI_MEMORYD_VECTOR_NPROBES:-64}"
      PI_MEMORYD_SPLIT_TABLES: "${PI_MEMORYD_SPLIT_TABLES:-true}"
      PI_MEMORYD_DUAL_WRITE_SPLIT: "${PI_MEMORYD_DUAL_WRITE_SPLIT:-true}"
      PI_MEMORYD_MAX_CONCURRENT_QUERIES: "${PI_MEMORYD_MAX_CONCURRENT_QUERIES:-2}"
      PI_MEMORYD_QUERY_TIMEOUT: "${PI_MEMORYD_QUERY_TIMEOUT:-30s}"
      PI_MEMORYD_STATE: "/data/dedup_state.json"
      AWS_DEFAULT_REGION: "${AWS_REGION:-auto}"
      AWS_ENDPOINT_URL: "${PI_MEMORYD_S3_ENDPOINT:-}"
      AWS_ENDPOINT: "${PI_MEMORYD_S3_ENDPOINT:-}"
      AWS_ACCESS_KEY_ID: "${PI_MEMORYD_KEY_ID:?set PI_MEMORYD_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${PI_MEMORYD_APPLICATION_KEY:?set PI_MEMORYD_APPLICATION_KEY}"
    volumes:
      - pi-memoryd-chunks-v4-data:/data
    depends_on:
      llama-embed:
        condition: service_healthy

  # CPU embedding runs on the VPS; upload clients only copy original files.
  # 4x Neoverse-N1 / 7.5GiB: -ngl 0 -t 2 -c 512. Same BGE GGUF as Mac ingest.
  llama-embed:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    ports:
      - "100.127.82.49:8091:8091"
    command:
      - -m
      - /models/bge-small-en-v1.5-f16.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8091"
      - --embedding
      - --pooling
      - cls
      - --embeddings
      - -c
      - "512"
      - -b
      - "512"
      - -ub
      - "512"
      - -ngl
      - "0"
      - -t
      - "2"
    volumes:
      - ./models:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pi-memoryd-data:
  pi-memoryd-chunks-v4-data:
