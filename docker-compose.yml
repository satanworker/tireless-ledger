services:
  pi-memoryd:
    build:
      context: .
      dockerfile: Dockerfile
    image: pi-memoryd:local
    restart: unless-stopped
    env_file: .env
    ports:
      - "100.127.82.49:8090:8090"
    environment:
      PI_MEMORYD_LISTEN: ":8090"
      PI_MEMORYD_STORAGE_URL: "s3://${PI_MEMORYD_S3_BUCKET:?set PI_MEMORYD_S3_BUCKET}/session-recall-lance"
      PI_MEMORYD_STATE: "/data/dedup_state.json"
      AWS_DEFAULT_REGION: "${AWS_REGION:-auto}"
      AWS_ENDPOINT_URL: "${PI_MEMORYD_S3_ENDPOINT:-}"
      AWS_ENDPOINT: "${PI_MEMORYD_S3_ENDPOINT:-}"
      AWS_ACCESS_KEY_ID: "${PI_MEMORYD_KEY_ID:?set PI_MEMORYD_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${PI_MEMORYD_APPLICATION_KEY:?set PI_MEMORYD_APPLICATION_KEY}"
    volumes:
      - pi-memoryd-data:/data

  # CPU embed only. docker compose --profile embed up
  # 4x Neoverse-N1 / 7.5GiB: -ngl 0 -t 2 -c 512. Same BGE GGUF as Mac ingest.
  llama-embed:
    profiles: ["embed"]
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    ports:
      - "100.127.82.49:8091:8091"
    command:
      - -m
      - /models/bge-small-en-v1.5-f16.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8091"
      - --embedding
      - --pooling
      - cls
      - --embeddings
      - -c
      - "512"
      - -b
      - "512"
      - -ub
      - "512"
      - -ngl
      - "0"
      - -t
      - "2"
    volumes:
      - ./models:/models:ro

volumes:
  pi-memoryd-data:
